# ============================================================
# campus-market Nginx 部署配置（周泓颖 / Redis 与工程化）
# 用途：静态托管前端 + /api 反代后端 8090
# 部门约定：前端 base = /campus-market/，后端端口 8090，接口前缀 /api/v1
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 与后端 application.yaml 的 max-request-size: 200MB 对齐
    # 否则文件/分片上传会被 nginx 先拦成 413
    client_max_body_size 200m;

    server {
        listen       80;
        server_name  localhost;

        # ------------------------------------------------------
        # 前端：Vite 打包产物
        # 注意 1：根路径下发的 cookie/path 都基于 /campus-market/，
        #         所以这里必须挂在这个子路径，不能挂在 "/"。
        # 注意 2：Windows 下用正斜杠，alias 末尾必须有斜杠。
        #         Linux 部署改成 /var/www/campus-market/dist/
        # ------------------------------------------------------
        location /campus-market/ {
            alias   D:/campus-market/campus-market/dist/;
            index   index.html;

            # Vue Router 用 history 模式时，找不到的文件一律回落 index.html
            try_files $uri $uri/ /campus-market/index.html;
        }

        # 访问 http://localhost/ 直接跳到前端首页，省得手输路径
        location = / {
            return 302 /campus-market/;
        }

        # ------------------------------------------------------
        # 后端接口：/api/v1/** 原样转发到 8090
        # 前端请求路径是 /api/v1/...，proxy_pass 不带 URI 时保留原始路径，
        # 到后端仍是 /api/v1/...，与 Controller 的 @RequestMapping 对齐。
        # ------------------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:8090;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 分片上传 / 大文件上传耗时较长，默认 60s 会掐断
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 上传后的文件如果走后端静态映射（/api/v1/file/**），上面规则已覆盖；
        # 若以后拆成独立静态目录，再加一条 location /upload/ { alias ...; }
    }
}
