# ============================================================
# campus-market Nginx 集群部署配置（周泓颖 / 中间件与联调）
#
# 拓扑：
#   Nginx 8080(HTTP) / 8443(HTTPS)
#     ├─ upstream pool_rr      轮询
#     ├─ upstream pool_weight  加权 3:1:1
#     ├─ upstream pool_iphash  IP 哈希
#     └─ upstream pool_least   最少连接
#            ↓
#   三个 campus-market 后端实例：8082 / 8083 / 8084
#
# 端口说明：本机 8081 被其他课程实验长期占用，故三实例用 8082-8084。
#           若 8081 空闲，把下面三处 8082/8083/8084 换成 8081/8082/8083 即可。
#
# 后端是 Spring Boot 3（内嵌 Tomcat、jakarta 命名空间），不是 war 部署，
# 三台节点由同一 jar 以不同 --server.port 启动构成，JWT 无状态，
# 会话不依赖容器复制，跨实例共享的是缓存（cache.store=redis，6380）。
#
# 运维：
#   nginx -p <nginx目录> -c conf/nginx.conf -t        校验
#   nginx -p <nginx目录> -c conf/nginx.conf -s reload 平滑重载
#   nginx -p <nginx目录> -c conf/nginx.conf -s stop   停止
#
# 部门约定：前端 base = /campus-market/，后端接口前缀 /api
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 与后端 application.yaml 的 max-request-size: 200MB 对齐
    client_max_body_size 200m;

    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript;
    gzip_min_length   1k;

    # 记录真实后端地址，联调时直接在 access.log 里看落到哪台
    log_format  main  '$remote_addr - $http_host "$request" $status '
                      'upstream=$upstream_addr time=$upstream_response_time';
    access_log  logs/access.log  main;

    # ---------- 代理头透传（四个 upstream 共用）----------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # ---------- 策略一：轮询 ----------
    upstream pool_rr {
        server 127.0.0.1:8082 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:8083 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:8084 max_fails=2 fail_timeout=30s;
    }

    # ---------- 策略二：加权 3:1:1 ----------
    upstream pool_weight {
        server 127.0.0.1:8082 weight=3 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:8083 weight=1 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:8084 weight=1 max_fails=2 fail_timeout=30s;
    }

    # ---------- 策略三：IP 哈希（同一客户端固定落到同一台）----------
    upstream pool_iphash {
        ip_hash;
        server 127.0.0.1:8082 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:8083 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:8084 max_fails=2 fail_timeout=30s;
    }

    # ---------- 策略四：最少连接 ----------
    upstream pool_least {
        least_conn;
        server 127.0.0.1:8082 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:8083 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:8084 max_fails=2 fail_timeout=30s;
    }

    server {
        listen       0.0.0.0:8080;
        server_name  localhost;

        # ------------------------------------------------------
        # 动静分离：静态资源由 Nginx 本地返回，不进后端
        # ------------------------------------------------------
        location /campus-market/ {
            alias   D:/campus-market/campus-market/dist/;
            index   index.html;
            try_files $uri $uri/ /campus-market/index.html;
            add_header Cache-Control "public, max-age=3600";
        }

        location /static/ {
            alias   D:/middleware-lab/nginx/static/;
            add_header Cache-Control "public, max-age=3600";
        }

        # ------------------------------------------------------
        # 四种策略的演示入口（前缀会去掉再转发）
        # ------------------------------------------------------
        location /rr/ {
            proxy_pass http://pool_rr/;
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
            add_header X-Strategy "round-robin" always;
        }

        location /weight/ {
            proxy_pass http://pool_weight/;
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
            add_header X-Strategy "weight-3:1" always;
        }

        location /iphash/ {
            proxy_pass http://pool_iphash/;
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
            add_header X-Strategy "ip-hash" always;
        }

        location /least/ {
            proxy_pass http://pool_least/;
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
            add_header X-Strategy "least-conn" always;
        }

        # ------------------------------------------------------
        # 业务接口：默认走轮询池
        # ------------------------------------------------------
        # WebSocket 转发：JSR-356 端点 /ws/consult，长连接需 Upgrade 与超时放宽
        location /ws/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
        }

        location /api/ {
            proxy_pass http://pool_rr;
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = / {
            return 302 /campus-market/;
        }
    }

    # ------------------------------------------------------
    # SSL 卸载：证书只在 Nginx 这层解密，后端仍是明文 HTTP
    # 演示用自签证书，生产替换为正式证书链
    # ------------------------------------------------------
    server {
        listen       0.0.0.0:8443 ssl;
        server_name  localhost;

        ssl_certificate      D:/middleware-lab/nginx/ssl/server.crt;
        ssl_certificate_key  D:/middleware-lab/nginx/ssl/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        # 静态资源：HTTPS 侧同样由 Nginx 本地返回，与 HTTP 侧对称
        location /static/ {
            alias   D:/middleware-lab/nginx/static/;
            add_header Cache-Control "public, max-age=3600";
        }

        location /campus-market/ {
            alias   D:/campus-market/campus-market/dist/;
            index   index.html;
            try_files $uri $uri/ /campus-market/index.html;
        }

        # WebSocket 转发：JSR-356 端点 /ws/consult，长连接需 Upgrade 与超时放宽
        location /ws/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
        }

        location /api/ {
            proxy_pass http://pool_rr;
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
        }

        location /rr/     { proxy_pass http://pool_rr/;     add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always; }
        location /weight/ { proxy_pass http://pool_weight/; add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always; }
        location /iphash/ { proxy_pass http://pool_iphash/; add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always; }
        location /least/  { proxy_pass http://pool_least/;  add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always; }
    }
}