server:
  port: 8090

spring:
  application:
    name: campus-market
  servlet:
    multipart:
      # 单个分片最大 20MB（分片大小建议 5MB，留足余量）
      max-file-size: 20MB
      # 单次请求最大 200MB（批量上传小文件 / 大分片请求）
      max-request-size: 200MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 关键点：末尾加了 allowPublicKeyRetrieval=true，解决连接报错
    url: jdbc:mysql://localhost:3306/campus_market?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Root123456  # 换成你自己的数据库密码！！！
  # Redis：cache.store=redis 时才真正连；配 memory 时即使本机没起 Redis 也不影响启动
  data:
    redis:
      host: localhost
      # 本机 6379 被火把节项目的 huobajie-redis 占用，campus-redis 映射在 6380
      port: 6380
      database: 0
      timeout: 3000ms
  # 邮件：邮箱验证码登录，QQ 邮箱 SMTP。授权码通过环境变量 MAIL_AUTH_CODE 注入，
  # 不要把真实授权码提交进仓库；留空时发码接口兜底走控制台日志，不影响本地启动
  mail:
    host: smtp.qq.com
    port: 465
    username: 702203337@qq.com
    password: ${MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
  # ActiveMQ Artemis 内嵌 broker：与 Spring Boot 同进程启动，无需单独装消息中间件；
  # 演示场景关闭消息持久化，重启后未消费消息不保留（生产环境需打开持久化）
  artemis:
    mode: embedded
    embedded:
      persistent: false
    pool:
      enabled: false

# 文件存储根目录（分片临时目录 staging + 最终目录 final）
file:
  storage:
    dir: file-storage

# JWT 配置
# secret 长度必须 >= 32 字符（HS256 要求），生产环境用环境变量 JWT_SECRET 覆盖，别把真实密钥提交到仓库
jwt:
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz123456abcdefghijklmnopqrstuvwxyz123456}
  # token 有效期（小时）
  expire-hours: 2

# 认证相关开关
auth:
  captcha:
    # 是否强制校验图形/短信验证码；联调期可临时 false，生产必须 true
    enabled: true
  sms:
    # 模拟短信通道总开关，默认 false：响应不回 devCode（只打日志），且登录短信分支直接拒绝；
    # true 时 devCode 回传、短信登录放行。自动化测试/现场演示临时开，生产关闭
    dev-echo: false
  email:
    # 邮箱验证码是否在响应体回显 devCode（联调/演示用）；默认 false，真实环境关闭
    dev-echo: false

# 缓存实现选择：memory（默认，重启即失，答辩兜底） | redis（周泓颖接好后切换）
cache:
  store: memory

mybatis-plus:
  configuration:
    # 开启控制台 SQL 打印，方便你看到 MyBatis-Plus 实际生成的 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名映射（比如数据库的 create_time 自动映射到实体类的 createTime）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 全局设置主键类型为数据库自增
      id-type: auto