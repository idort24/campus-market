server:
  port: 8090

spring:
  application:
    name: campus-market
  servlet:
    multipart:
      # 单个分片最大 20MB（分片大小建议 5MB，留足余量）
      max-file-size: 20MB
      # 单次请求最大 200MB（批量上传小文件 / 大分片请求）
      max-request-size: 200MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 关键点：末尾加了 allowPublicKeyRetrieval=true，解决连接报错
    url: jdbc:mysql://localhost:3306/campus_market?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: sys20261013

# 文件存储根目录（分片临时目录 staging + 最终目录 final）
file:
  storage:
    dir: file-storage

# JWT 配置
# secret 长度必须 >= 32 字符（HS256 要求），生产环境用环境变量 JWT_SECRET 覆盖，别把真实密钥提交到仓库
jwt:
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz123456abcdefghijklmnopqrstuvwxyz123456}
  # token 有效期（小时）
  expire-hours: 2

mybatis-plus:
  configuration:
    # 开启控制台 SQL 打印，方便你看到 MyBatis-Plus 实际生成的 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名映射（比如数据库的 create_time 自动映射到实体类的 createTime）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 全局设置主键类型为数据库自增
      id-type: auto